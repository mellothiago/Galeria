<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planilha Simples</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f6f8;
      color: #1f2328;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .sheet-wrapper {
      overflow: auto;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.08);
    }

    table {
      border-collapse: collapse;
      min-width: 920px;
    }

    th,
    td {
      border: 1px solid #d0d7de;
      min-width: 100px;
      height: 32px;
      padding: 0;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f6f8fa;
      font-weight: 600;
      text-align: center;
      user-select: none;
    }

    td {
      background: #fff;
    }

    td[contenteditable="true"] {
      padding: 4px 8px;
      outline: none;
      cursor: text;
    }

    td[contenteditable="true"]:focus {
      box-shadow: inset 0 0 0 2px #0969da;
      background: #f0f7ff;
    }

    .row-header {
      min-width: 48px;
      text-align: center;
      background: #f6f8fa;
      user-select: none;
    }
  </style>
</head>
